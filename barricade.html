<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲーム部屋">
<title>バリケード</title>
<link rel="stylesheet" href="style.css">
<style>
  /* barricade.gg 風のダークな画面 */
  :root, :root:not([data-theme="light"]) {
    --table: #000; --board: #161616; --line: #3a3a3a;
    --ink: #f2f2f2; --sub: #9a9a9a; --p1: #e5484d; --p2: #3b82f6;
  }
  body { background: #000; font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif; }
  .board-box { background: #161616; box-shadow: none; border-radius: 12px; padding: 8px; }
  .badge {
    display: flex; justify-content: center; margin: 8px 0;
  }
  .badge span {
    display: inline-flex; align-items: center; gap: 6px;
    color: #fff; font-weight: 700; font-size: 14px;
    padding: 2px 12px; border-radius: 6px;
  }
  .badge span::before { content: ''; width: 12px; height: 4px; border-radius: 2px; background: #fff; }
  .badge .p1 { background: var(--p1); }
  .badge .p2 { background: var(--p2); }
  /* 2人で向かい合って遊べるように、上(青)と下(赤)に操作パネル */
  .pad { background: #161616; border-radius: 12px; padding: 8px; margin: 6px 0; border: 2px solid transparent; transition: opacity .2s;
    display: grid; grid-template-columns: 5.6em 1fr; gap: 8px; align-items: center; }
  .pad.p1 { border-color: var(--p1); } .pad.p2 { border-color: var(--p2); }
  .pad.flip { transform: rotate(180deg); }
  .pad.off { opacity: .35; }
  .pad .head { font-weight: 700; font-size: 13px; line-height: 1.3; }
  .pad .left { display: inline-block; color: #fff; font-size: 12px; padding: 1px 8px; border-radius: 6px; margin-top: 3px; }
  .pad.p1 .left { background: var(--p1); } .pad.p2 .left { background: var(--p2); }
  .pad .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pad .row.two { grid-template-columns: 1fr 1fr; }
  .pad .btn { padding: 10px 2px; font-size: 15px; }
  .pad .ok { background: #fff; color: #111; border-color: #fff; }
  .pad .why { color: #ff8a8a; font-size: 11px; }
  #turn { display: none; }
  .board-box svg { cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← ゲーム一覧</a><h1>バリケード</h1></div>
  <p class="turn" id="turn"></p>
  <div class="pad p2 flip" id="pad1"></div>
  <div class="board-box"><svg id="svg" viewBox="0 0 460 460"></svg></div>
  <div class="pad p1" id="pad0"></div>
  <div class="bar"><button class="btn" id="reset">最初から</button></div>
  <details class="rules" open>
    <summary>ルール</summary>
    <ul>
      <li>赤は上の端(赤い列)、青は下の端(青い列)にたどり着いたら勝ち。</li>
      <li>自分の番は「コマを1マス動かす」か「壁を1枚置く」のどちらか。壁は1人10枚。</li>
      <li>壁は、盤をタップした所に仮置きされる。位置を確かめて「確定」を押すと置ける。</li>
      <li>スマホを2人の間に置くと、青の操作は上(逆さ向き)、赤の操作は下に出る。</li>
      <li>壁は2マス分の長さ。重ねたり、十字に交差させたりはできない。</li>
      <li>どちらのコマもゴールに行ける道が必ず残るように置く。ふさぐ置き方はできない。</li>
      <li>相手のコマが隣にいたら飛び越せる。後ろが壁なら斜めに進める。</li>
    </ul>
  </details>
</div>
<script src="online.js"></script>
<script>
const N = 9, P = 50, S = 40, M = 10;
const svg = document.getElementById('svg');
const NAME = ['赤', '青'];
let pos, walls, left, player, winner, mode = 'move', err = '', pending = null;

function reset() {
  pos = [[8, 4], [0, 4]]; walls = []; left = [10, 10]; player = 0; winner = null; err = ''; mode = 'move'; pending = null;
  draw();
}

const has = (o, r, c) => walls.some(w => w.o === o && w.r === r && w.c === c);

function blocked(r, c, dr, dc) {
  if (dr === 1) return has('h', r, c) || has('h', r, c - 1);
  if (dr === -1) return has('h', r - 1, c) || has('h', r - 1, c - 1);
  if (dc === 1) return has('v', r, c) || has('v', r - 1, c);
  return has('v', r, c - 1) || has('v', r - 1, c - 1);
}
const inside = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function moves(p) {
  const [r, c] = pos[p], [or, oc] = pos[1 - p], out = [];
  for (const [dr, dc] of DIRS) {
    const nr = r + dr, nc = c + dc;
    if (!inside(nr, nc) || blocked(r, c, dr, dc)) continue;
    if (nr === or && nc === oc) {
      const jr = nr + dr, jc = nc + dc;
      if (inside(jr, jc) && !blocked(nr, nc, dr, dc)) out.push([jr, jc]);
      else for (const [sr, sc] of dr ? [[0, 1], [0, -1]] : [[1, 0], [-1, 0]]) {
        const tr = nr + sr, tc = nc + sc;
        if (inside(tr, tc) && !blocked(nr, nc, sr, sc)) out.push([tr, tc]);
      }
    } else out.push([nr, nc]);
  }
  return out;
}

function canReach(p) {
  const goal = p === 0 ? 0 : N - 1, seen = new Set([pos[p].join()]), q = [pos[p]];
  while (q.length) {
    const [r, c] = q.shift();
    if (r === goal) return true;
    for (const [dr, dc] of DIRS) {
      const nr = r + dr, nc = c + dc, k = nr + ',' + nc;
      if (inside(nr, nc) && !blocked(r, c, dr, dc) && !seen.has(k)) { seen.add(k); q.push([nr, nc]); }
    }
  }
  return false;
}

// 置けるなら空文字、置けないなら理由を返す
function wallProblem(o, r, c) {
  if (left[player] === 0) return '壁はもう残ってない';
  const clash = has('h', r, c) || has('v', r, c) ||
    (o === 'h' ? has('h', r, c - 1) || has('h', r, c + 1) : has('v', r - 1, c) || has('v', r + 1, c));
  if (clash) return 'ほかの壁と重なるから置けない';
  walls.push({ o, r, c });
  const ok = canReach(0) && canReach(1);
  walls.pop();
  return ok ? '' : 'ゴールまでの道が全部ふさがるから置けない';
}
function placeWall(o, r, c) {
  const why = wallProblem(o, r, c);
  if (why) return err = why;
  walls.push({ o, r, c });
  left[player]--; err = ''; endTurn();
}
function endTurn() { player = 1 - player; mode = 'move'; pending = null; }

function movePawn(r, c) {
  if (!moves(player).some(m => m[0] === r && m[1] === c)) return;
  pos[player] = [r, c]; err = '';
  if (r === (player === 0 ? 0 : N - 1)) { winner = player; pending = null; } else endTurn();
}

const X = c => M + c * P;

function draw() {
  let s = '';
  const legal = winner === null && mode === 'move' ? moves(player) : [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const fill = r === 0 ? '#5a2427' : r === N - 1 ? '#22345a' : '#2a2a2a';
    const edge = r === 0 ? '#7a3236' : r === N - 1 ? '#2f4a80' : '#333';
    const isLegal = legal.some(m => m[0] === r && m[1] === c);
    s += `<rect x="${X(c)}" y="${X(r)}" width="${S}" height="${S}" rx="3" fill="${fill}" stroke="${edge}" stroke-width="1.5"
      ${isLegal ? `style="cursor:pointer" data-r="${r}" data-c="${c}"` : ''}/>`;
    if (isLegal) s += `<circle cx="${X(c) + S / 2}" cy="${X(r) + S / 2}" r="6" fill="var(--${player ? 'p2' : 'p1'})" opacity=".55" pointer-events="none"/>`;
  }
  pos.forEach(([r, c], p) => {
    s += `<circle cx="${X(c) + S / 2}" cy="${X(r) + S / 2}" r="12" fill="var(--${p ? 'p2' : 'p1'})" pointer-events="none"/>`;
  });
  for (const w of walls) {
    const col = '#e6e6e6';
    if (w.o === 'h') s += `<rect x="${X(w.c)}" y="${X(w.r) + S + 1}" width="${P + S}" height="8" rx="4" fill="${col}"/>`;
    else s += `<rect x="${X(w.c) + S + 1}" y="${X(w.r)}" width="8" height="${P + S}" rx="4" fill="${col}"/>`;
  }
  if (pending) {
    const col = pending.why ? '#888' : `var(--${player ? 'p2' : 'p1'})`, w = pending;
    if (w.o === 'h') s += `<rect x="${X(w.c)}" y="${X(w.r) + S + 1}" width="${P + S}" height="8" rx="4" fill="${col}" opacity=".85" stroke="#fff" stroke-dasharray="4 3"/>`;
    else s += `<rect x="${X(w.c) + S + 1}" y="${X(w.r)}" width="8" height="${P + S}" rx="4" fill="${col}" opacity=".85" stroke="#fff" stroke-dasharray="4 3"/>`;
  }
  svg.innerHTML = s;
  drawPads();
  Online.sync();
  const t = document.getElementById('turn');
  const cls = (winner ?? player) === 0 ? 'p1' : 'p2';
  t.className = 'turn' + (winner !== null ? ' win' : '');
  t.innerHTML = `<span class="dot ${cls}"></span>` + (winner !== null ? `${NAME[winner]}の勝ち` : `${NAME[player]}の番` + (err ? `<span class="note">　${err}</span>` : ''));
}

function drawPads() {
  const online = Online.active, me = online ? Online.me : null;
  for (const p of [0, 1]) {
    const el = document.getElementById('pad' + p);
    // オンラインでは自分のパネルだけ、盤の下に向きを直して出す
    el.style.display = !online || p === me ? '' : 'none';
    if (online && p === me && el.classList.contains('flip')) { el.classList.remove('flip'); document.querySelector('.board-box').after(el); }
    const mine = winner === null && player === p;
    el.classList.toggle('off', !mine);
    const dis = mine ? '' : 'disabled';
    const state = winner !== null ? (winner === p ? '勝ち!' : '負け') : mine ? (pending ? (pending.why ? '置けない' : 'ここでいい?') : 'あなたの番') : '相手の番';
    let h = `<div class="head">${state}<br><span class="left">壁 ${left[p]}</span>` +
      (mine && pending && pending.why ? `<div class="why">${pending.why}</div>` : '') + `</div>`;
    // 仮置き中は、ボタンを「確定/やめる」に入れかえる(高さを変えないため)
    if (mine && pending) {
      h += `<div class="row two"><button class="btn ok" data-ok="${p}" ${pending.why ? 'disabled' : ''}>確定</button><button class="btn" data-cancel="${p}">やめる</button></div>`;
    } else {
      h += `<div class="row">` + [['move', '動かす'], ['h', '横の壁'], ['v', '縦の壁']].map(([m, t]) =>
        `<button class="btn ${mine && mode === m ? 'on' : ''}" data-mode="${m}" data-p="${p}" ${dis}>${t}</button>`).join('') + `</div>`;
    }
    el.innerHTML = h;
  }
}

// タップした所から一番近い壁の位置を出す(小さいスマホでも狙いやすいように)
function nearestWall(e, o) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  const clamp = v => Math.max(0, Math.min(N - 2, v));
  const gap = v => clamp(Math.round((v - M - S - 5) / P));
  const cell = v => clamp(Math.round((v - M - S / 2 - P / 2) / P));
  return o === 'h' ? { o, r: gap(q.y), c: cell(q.x) } : { o, r: cell(q.y), c: gap(q.x) };
}

svg.addEventListener('click', e => {
  if (winner !== null || !Online.canAct()) return;
  if (mode === 'move') {
    const d = e.target.dataset;
    if (d.r !== undefined) movePawn(+d.r, +d.c);
  } else {
    const w = nearestWall(e, mode);
    pending = { ...w, why: wallProblem(w.o, w.r, w.c) };
  }
  draw();
});
document.querySelectorAll('.pad').forEach(pad => pad.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled || !Online.canAct()) return;
  const d = b.dataset;
  if (d.mode && +d.p === player) { mode = d.mode; pending = null; err = ''; }
  if (d.ok !== undefined && pending && !pending.why) placeWall(pending.o, pending.r, pending.c);
  if (d.cancel !== undefined) pending = null;
  draw();
}));
document.getElementById('reset').onclick = reset;
Online.init({ game: 'barricade', names: NAME,
  getState: () => ({ pos, walls, left, player, winner }),
  setState: s => { const turnChanged = s.player !== player; ({ pos, walls, left, player, winner } = s); err = ''; if (turnChanged) { mode = 'move'; pending = null; } draw(); },
  turn: () => winner === null ? player : null });
reset();
</script>
</body>
</html>
