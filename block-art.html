<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲーム部屋">
<title>写真をブロック絵に</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* 土と草ブロックっぽい見た目 */
  :root, :root:not([data-theme="light"]) {
    --table: #6b4a2e; --board: #c6c6c6; --line: #555; --ink: #1e1e1e; --sub: #3c3c3c; --ok: #5c9e31;
  }
  body {
    font-family: 'DotGothic16', 'M PLUS Rounded 1c', monospace;
    background-color: #6b4a2e;
    background-image: linear-gradient(#5c9e31 0 18px, #3f7a1f 18px 24px, transparent 24px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 8px, transparent 8px 16px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 8px, transparent 8px 16px);
  }
  .top a, .top h1 { color: #fff; text-shadow: 2px 2px 0 #000; }
  .panel { background: var(--board); border: 4px solid; border-color: #fff #555 #555 #fff; padding: 14px; margin-bottom: 12px; }
  .btn { border-radius: 0; border: 3px solid; border-color: #e0e0e0 #4a4a4a #4a4a4a #e0e0e0; background: #8b8b8b; color: #fff; text-shadow: 1px 1px 0 #333; font-family: inherit; }
  .btn.on { background: #5c9e31; color: #fff; }
  .btn:disabled { opacity: .5; }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; background: #222; }
  .mats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; font-size: 14px; }
  .mats div { display: flex; align-items: center; gap: 6px; background: #b0b0b0; padding: 4px 6px; }
  .mats i { width: 18px; height: 18px; flex: none; border: 2px solid rgba(0,0,0,.35); }
  .note { color: #333; }
  .err { color: #a00; font-weight: 700; }
  .rules, .rules summary { color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← ゲーム一覧</a><h1>写真をブロック絵に</h1></div>
  <div class="panel">
    <div class="bar" style="margin-top:0">
      <label class="btn" style="margin:0">写真を選ぶ<input type="file" id="file" accept="image/*" hidden></label>
      <span class="note">大きさ:</span>
      <button class="btn" data-n="32">32</button><button class="btn on" data-n="48">48</button><button class="btn" data-n="64">64</button>
    </div>
    <p class="note" id="msg">写真を選ぶと、羊毛ブロック16色でできたドット絵にする。</p>
  </div>
  <div class="panel"><canvas id="cv" width="480" height="480"></canvas>
    <div class="bar"><button class="btn" id="save" disabled>画像を保存</button></div>
  </div>
  <div class="panel"><b>材料リスト</b><span class="note" id="total"></span><div class="mats" id="mats"></div></div>
  <details class="rules">
    <summary>メモ</summary>
    <ul>
      <li>写真を小さくして、1マスずつ一番近い色のブロックに置きかえる。</li>
      <li>材料リストは、実際にマイクラで建てるときに何ブロック要るかの目安。</li>
      <li>色は本物のブロックに似せてるだけ。</li>
      <li>立体にはならない。平面のドット絵まで。</li>
      <li>iPhoneのHEIC写真は読めないことがある。そのときはJPEGにしてから選ぶ。</li>
    </ul>
  </details>
</div>
<script>
// 羊毛16色(近い色を手で選んだもの)
const BLOCKS = [
  ['白の羊毛', '#e9ecec'], ['薄灰色の羊毛', '#8e8e86'], ['灰色の羊毛', '#3e4447'], ['黒の羊毛', '#151519'],
  ['茶色の羊毛', '#724728'], ['赤の羊毛', '#a02722'], ['橙色の羊毛', '#f07613'], ['黄色の羊毛', '#f8c527'],
  ['黄緑色の羊毛', '#70b919'], ['緑の羊毛', '#546d1b'], ['青緑の羊毛', '#158991'], ['空色の羊毛', '#3aafd9'],
  ['青の羊毛', '#35399d'], ['紫の羊毛', '#7a2aad'], ['赤紫の羊毛', '#bd44b3'], ['桃色の羊毛', '#ed8dac'],
].map(([name, hex]) => ({ name, hex, rgb: [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)) }));

const cv = document.getElementById('cv'), g = cv.getContext('2d');
const msg = document.getElementById('msg');
let img = null, N = 48, grid = null;

// 人の目に近い重みで色の近さを測る
function nearest(r, gg, b) {
  let best = 0, bd = Infinity;
  BLOCKS.forEach((k, i) => {
    const [R, G, B] = k.rgb, rm = (r + R) / 2;
    const d = (2 + rm / 256) * (r - R) ** 2 + 4 * (gg - G) ** 2 + (2 + (255 - rm) / 256) * (b - B) ** 2;
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

function render() {
  if (!img) return;
  const w = img.width >= img.height ? N : Math.max(1, Math.round(N * img.width / img.height));
  const h = img.height > img.width ? N : Math.max(1, Math.round(N * img.height / img.width));
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const t = tmp.getContext('2d'); t.drawImage(img, 0, 0, w, h);
  const px = t.getImageData(0, 0, w, h).data;
  grid = { w, h, cells: [] };
  for (let i = 0; i < w * h; i++) grid.cells.push(px[i * 4 + 3] < 40 ? -1 : nearest(px[i * 4], px[i * 4 + 1], px[i * 4 + 2]));

  const S = Math.max(6, Math.floor(960 / Math.max(w, h)));
  cv.width = w * S; cv.height = h * S;
  grid.cells.forEach((k, i) => {
    if (k < 0) return;
    const x = (i % w) * S, y = Math.floor(i / w) * S;
    g.fillStyle = BLOCKS[k].hex; g.fillRect(x, y, S, S);
    // ブロックのふち(左上は明るく、右下は暗く)
    const e = Math.max(1, Math.floor(S / 8));
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x, y, S, e); g.fillRect(x, y, e, S);
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x, y + S - e, S, e); g.fillRect(x + S - e, y, e, S);
  });

  const count = {};
  grid.cells.forEach(k => { if (k >= 0) count[k] = (count[k] || 0) + 1; });
  const list = Object.entries(count).sort((a, b) => b[1] - a[1]);
  const total = list.reduce((s, [, n]) => s + n, 0);
  document.getElementById('total').textContent = `　全部で ${total} ブロック(${w}×${h})`;
  document.getElementById('mats').innerHTML = list.map(([k, n]) =>
    `<div><i style="background:${BLOCKS[k].hex}"></i>${BLOCKS[k].name} ${n}${n >= 64 ? `(${Math.floor(n / 64)}スタック${n % 64 ? '+' + (n % 64) : ''})` : ''}</div>`).join('');
  document.getElementById('save').disabled = false;
}

document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { img = im; msg.className = 'note'; msg.textContent = f.name; render(); };
  im.onerror = () => { msg.className = 'err'; msg.textContent = 'この画像は読み込めなかった。HEICならJPEGにしてから選んで。'; };
  im.src = url;
};
document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
  N = +b.dataset.n;
  document.querySelectorAll('[data-n]').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('save').onclick = () => {
  const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'block-art.png'; a.click();
};
</script>
</body>
</html>
